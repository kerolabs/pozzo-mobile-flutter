name: Flutter

on:
  push:
  pull_request:

jobs:
  # Static analysis and tests on every change, as the backend does with its suite.
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The same Flutter as the team: newer releases deprecate package:flutter/material.dart.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
