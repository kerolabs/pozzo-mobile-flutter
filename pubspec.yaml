name: pozzo
description: "Cross-platform application of Pozzo, the savings group app by Kerolabs."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  get_it: ^9.3.0
  sqflite: ^2.4.6
  path: ^1.9.1
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf

